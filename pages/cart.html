<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/global.css">
</head>

<body>
    <div id="target-header"></div>

    <div class="mx-auto items-center w-full max-w-[1170px] mb-0 mt-10">
        <p class="ml-[20px]">Home/cart</p>
    </div>
    
<section class="mt-6 sm:mt-14 lg:mt-[80px] w-full max-w-[1170px] mx-auto px-4 sm:px-6">

    <div
        class="grid grid-cols-4
               items-center
               h-[60px] sm:h-[72px]
               border
               rounded-[4px]
               px-3 sm:px-6
               text-xs sm:text-sm lg:text-base"
    >

        <p>Product</p>
        <p>Price</p>
        <p>Quantity</p>
        <p>Subtotal</p>

    </div>

</section>


<!-- product 1 -->
<section class="mt-6 sm:mt-8 lg:mt-10 w-full max-w-[1170px] mx-auto px-4 sm:px-6">

    <div
        class="grid grid-cols-4
               items-center
               min-h-[90px] sm:h-[102px]
               border
               rounded-[4px]
               px-3 sm:px-6
               text-xs sm:text-sm lg:text-base"
    >

        <!-- product -->
        <div class="flex items-center gap-2 sm:gap-4 min-w-0">

            <img
                class="w-10 h-10 sm:w-[54px] sm:h-[54px]
                       object-contain shrink-0"
                src="../images/image5.svg"
                alt="LCD Monitor"
            >
            <span class="truncate">
                LCD Monitor
            </span>

        </div>
        <!-- price p -->
        <p>$650</p>
        <!-- quality -->
        <span
            class="flex items-center justify-between
                   gap-2
                   border rounded
                   px-2 sm:px-3
                   h-8 sm:h-10
                   w-fit"
        >
            <span>01</span>

            <img
                class="w-2.5 h-2.5 sm:w-3 sm:h-3"
                src="../images/image10.svg"
                alt=""
            >
        </span>


        <!-- subtotal -->
        <p>
            $650
        </p>

    </div>

</section>


<!-- product 2 -->
<section class="mt-6 sm:mt-8 lg:mt-10 w-full max-w-[1170px] mx-auto px-4 sm:px-6">

    <div
        class="grid grid-cols-4
               items-center
               min-h-[90px] sm:h-[102px]
               border
               rounded-[4px]
               px-3 sm:px-6
               text-xs sm:text-sm lg:text-base"
    >

        <!-- product -->
        <div class="flex items-center gap-2 sm:gap-4 min-w-0">

            <img
                class="w-10 h-10 sm:w-[54px] sm:h-[54px]
                       object-contain shrink-0"
                src="../images/image3.svg"
                alt="H1 Gamepad"
            >

            <span class="truncate">
                H1 Gamepad
            </span>

        </div>


        <!-- price p -->
        <p>$550</p>
        <span
            class="flex items-center justify-between
                   gap-2
                   border rounded
                   px-2 sm:px-3
                   h-8 sm:h-10
                   w-fit"
        >
            <span>02</span>

            <img
                class="w-3.5 h-3.5 sm:w-3 sm:h-3"
                src="../images/image10.svg"
                alt=""
            >
        </span>


        <!-- subtotal -->
        <p>$1100</p>
    </div>

</section>


<!-- return / update button -->
<section
    class="flex flex-col sm:flex-row
           justify-between
           items-stretch sm:items-center
           gap-4
           mt-6 sm:mt-7
           w-full max-w-[1170px]
           mx-auto px-4 sm:px-6">

    <button
        class="w-full sm:w-[218px]
               h-[50px] sm:h-[56px]
               border
               rounded-[4px]
               text-sm">
        Return to Shop
    </button>

    <button
        class="w-full sm:w-[218px]
               h-[50px] sm:h-[56px]
               border
               rounded-[4px]
               text-sm
               hover:bg-black hover:text-white
               transition duration-200"
    >
        Update Cart
    </button>

</section>


<!-- coupon + cart total -->
<section
    class="mt-10 sm:mt-12
           flex flex-col lg:flex-row
           justify-between
           items-stretch lg:items-start
           gap-8 lg:gap-10
           w-full max-w-[1170px]
           mx-auto px-4 sm:px-6"
>


    <!-- coupon -->
    <div
        class="flex flex-col sm:flex-row
               gap-3
               w-full lg:w-auto">
        <button class="class=w-full sm:w-[218px]
                   h-[50px] sm:h-[56px]
                   rounded-[4px]
                   text-sm
                   border">
            Coupon Code
        </button>

        <button
            class="w-full sm:w-[218px]
                   h-[50px] sm:h-[56px]
                   rounded-[4px]
                   bg-[#DB4444]
                   text-white
                   text-sm
                   hover:bg-[#c93636]
                   transition duration-200"
        >
            Apply Coupon
        </button>

    </div>


    <!-- cart total -->
    <div
        class="w-full
               lg:w-[470px]
               min-h-[324px]
               rounded-[4px]
               border border-black
               p-5 sm:p-6 lg:p-8"
    >

        <!-- title -->
        <p
            class="mb-5 sm:mb-6
                   text-xl sm:text-2xl
                   font-medium"
        >
            Cart Total
        </p>


        <!-- subtotal -->
        <div
            class="flex items-center justify-between
                   py-3 sm:py-4
                   text-sm sm:text-base"
        >
            <p>Subtotal</p>
            <p> $1750</p>

        </div>
        <hr class="border-gray-300">
        <!-- shipping -->
        <div
            class="flex items-center justify-between
                   py-3 sm:py-4
                   text-sm sm:text-base"
        >

            <p>Shipping</p>
            <p>Free</p>
        </div>
        <hr class="border-gray-300">
        <!-- total -->
        <div
            class="flex items-center justify-between
                   py-3 sm:py-4
                   text-sm sm:text-base
                   font-medium"
        >
            <p>Total</p>
            <p> $1750</p>
        </div>


        <!-- CHECKOUT -->
        <div class="flex justify-center mt-3 sm:mt-4">

            <button
                class="w-full sm:w-[218px]
                       h-[50px] sm:h-[56px]
                       rounded-[4px]
                       bg-[#DB4444]
                       text-white
                       text-sm
                       hover:bg-[#c93636]
                       transition duration-200"
            >
                Proceed to Checkout
            </button>

        </div>

    </div>

</section>

    <div id="target-footer"></div>
    <script src="../js/global.js"></script>
    <script>
        fetch('../components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('target-header').innerHTML = data;
                setupNavbarEvents();
            })
            .catch(error => console.error('Error loading HTML:', error));
        fetch('../components/footer.html').then(response => response.text()).then(data => {
            document.getElementById('target-footer').innerHTML = data;
        })
    </script>
</body>

</html>
