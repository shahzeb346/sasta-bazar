<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <!-- navbar don't change this  -->
    <div id="target-header"></div>


    <!-- main content -->
    <!-- main content -->
    <div class="contener">
        <div class="img">
            <img src="/images/login.jpg" alt="">
        </div>
        <div class="content">
            <h1>Log in to Exclusive</h1>
            <p>Enter your details below</p>
            <form action="" class="form">
                <input type="email" placeholder="Email or Phone Number">
                <input type="password" placeholder="Password">
                <div class="login">
                <button>Log In</button>
                <a>Forget  Password?</a>
                </div>
            </form>
        </div>

    </div>



    <!-- footer don't change this  -->
    <div id="target-footer"></div>
    <script src="../js/global.js"></script>
    <script>
        fetch('../components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('target-header').innerHTML = data;
                setupNavbarEvents();
            })
            .catch(error => console.error('Error loading HTML:', error));
        fetch('../components/footer.html').then(response => response.text()).then(data => {
            document.getElementById('target-footer').innerHTML = data;
        })
    </script>
</body>

</html>
