<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce signup</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>
    <!-- navbar don't change this  -->
    <div id="target-header"></div>


    <!-- main content -->
    <div class="contener">
        <div class="img">
            <img src="/images/login.jpg" alt="">
        </div>
        <div class="content">
            <h1>Create an account</h1>
            <p>Enter your details below</p>
            <form action="" class="form">
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email or Phone Number">
                <input type="password" placeholder="Password">
                <button>Create Account</button>
                <button><img src="/icons/google.svg" alt=""></a>Sign up with Google</button>
                <p>Already have account?<a > Log In</a></p>

            </form>
        </div>

    </div>


    <!-- footer don't change this  -->
    <div id="target-footer"></div>
    <script src="../js/global.js"></script>
    <script>
        fetch('../components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('target-header').innerHTML = data;
                setupNavbarEvents();
            })
            .catch(error => console.error('Error loading HTML:', error));
        fetch('../components/footer.html').then(response => response.text()).then(data => {
            document.getElementById('target-footer').innerHTML = data;
        })
    </script>
</body>

</html>
